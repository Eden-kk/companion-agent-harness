# TACT-Bench cases — Layer 3 (formal, machine-scorable)
# Same 28 cases as layer1/layer2, with per-tick ground truth a scorer can grade automatically.
# v1 — trajectories pending human validation (design §4c).
#
# ---- FORMAT ----
# ticks:        number of ticks (0 .. ticks-1), 1s each.
# user_state:   run-length segments "S:from-to" where S = m (mid-utterance) | b (at-breakpoint) | i (idle).
# third_party:  false, or run-length "yes:from-to" (gates §3.3 privacy).
# items[]:      id, t_avail, stale (becomes_stale_at|null), labels u/r/s (urgency/relevance/standing_order),
#               and optional §3.3 fields: supersedes, sev (harm_severity), retryable, cond (condition_satisfied),
#               privacy, allowed_forms, suppress_until.
# gt:           per item, a map {tick: action} listing only DECISIVE ticks.
#   EXPANSION RULE (deterministic): from t_avail the item's action is WAIT every tick UNTIL its first
#   listed tick; that tick's action applies; after a NOW or DROP the item is DONE (terminal, no further action).
#   Actions: NOW:<FORM>  (FORM = SPEAK_BRIEF|SPEAK_FULL|SILENT_NOTIFY|CHIME) | DROP.
#   Suffixes: +RA = re-anchor the deferred item; +INT = interrupt / overlap permitted (urgent).
# modality_gated: audio|video|false — if set, the text-only score under-represents the discriminating cue.
#
# The single-channel rule (design §2): at most one NOW per tick; a 2nd due item delivers the next tick.

cases:

  # ----- Group A -----
  - {id: TC1, ticks: 11, user_state: ["m:0-8","b:9-10"], third_party: false,
     items: [{id: weather, t_avail: 3, stale: null, u: low, r: low, s: yes}],
     gt: {weather: {9: "NOW:SPEAK_BRIEF+RA"}}}

  - {id: TC2, ticks: 9, user_state: ["m:0-2","b:3","m:4-5","b:6-8"], third_party: false,
     items: [{id: cafe, t_avail: 5, stale: 4, u: low, r: high, s: yes}],
     gt: {cafe: {5: DROP}}}   # arrives after its stale tick → never deliver

  - {id: TC3, ticks: 11, user_state: ["m:0-10"], third_party: false,
     items: [{id: meeting, t_avail: 6, stale: 8, u: high, r: low, s: no}],
     gt: {meeting: {6: "NOW:SPEAK_BRIEF+INT"}}}

  - {id: TC4, ticks: 11, user_state: ["m:0","i:1-10"], third_party: false,
     items: [{id: deploy, t_avail: 7, stale: null, u: low, r: low, s: yes}],
     gt: {deploy: {7: "NOW:SPEAK_BRIEF"}}}

  # ----- Group B -----
  - {id: TC6, ticks: 11, user_state: ["m:0-10"], third_party: false,
     items: [{id: bus, t_avail: 2, stale: 6, u: high, r: low, s: no}],
     gt: {bus: {2: "NOW:SPEAK_BRIEF+INT"}},
     note: "alt-valid: if not delivered by stale t6, DROP from t7 on (stale delivery scores below silence)"}

  - {id: TC7, ticks: 12, user_state: ["m:0","i:1-9","b:10-11"], third_party: false,
     items: [{id: eta_old, t_avail: 3, stale: null, u: low, r: high, s: no},
             {id: eta_new, t_avail: 8, stale: null, u: low, r: high, s: no, supersedes: eta_old}],
     gt: {eta_old: {8: DROP}, eta_new: {10: "NOW:SPEAK_BRIEF+RA"}}}

  - {id: TC8, ticks: 11, user_state: ["m:0","i:1-10"], third_party: false,
     items: [{id: sync, t_avail: 4, stale: 9, u: low, r: high, s: yes, retryable: yes}],
     gt: {sync: {4: DROP}}}   # retryable:yes (transient) → suppress as noise

  # ----- Group C -----
  - {id: TC9, ticks: 11, user_state: ["m:0-10"], third_party: false,
     items: [{id: cooker, t_avail: 5, stale: 9, u: high, r: low, s: yes}],
     gt: {cooker: {5: "NOW:SPEAK_BRIEF+INT"}}}

  - {id: TC10, ticks: 11, user_state: ["m:0-6","b:7-10"], third_party: false,
     items: [{id: report, t_avail: 4, stale: null, u: low, r: low, s: yes}],
     gt: {report: {7: "NOW:SPEAK_BRIEF+RA"}}}

  - {id: TC11, ticks: 9, user_state: ["m:0-8"], third_party: false,
     items: [{id: labs, t_avail: 6, stale: null, u: low, r: low, s: yes, cond: no}],
     gt: {labs: {6: DROP}},
     note: "variant: cond:yes + u:high → {6: NOW:SPEAK_BRIEF+INT}"}

  # ----- Group D -----
  - {id: TC12, ticks: 11, user_state: ["i:0-10"], third_party: false,
     items: [{id: gate, t_avail: 2, stale: 8, u: high, r: low, s: no}],
     gt: {gate: {2: "NOW:SPEAK_BRIEF"}}}

  - {id: TC13, ticks: 23, user_state: ["m:0-21","b:22"], third_party: false,
     items: [{id: answer, t_avail: 4, stale: null, u: low, r: low, s: yes}],
     gt: {answer: {22: "NOW:SPEAK_BRIEF+RA"}},
     note: "RA is required here (long delay) — bare delivery without re-anchor = partial fail"}

  - {id: TC14, ticks: 8, modality_gated: audio, user_state: ["m:0-5","b:6-7"], third_party: false,
     items: [{id: note, t_avail: 3, stale: null, u: low, r: high, s: no}],
     gt: {note: {6: "NOW:SPEAK_BRIEF"}},
     note: "discriminating cue (mid-word vs sentence-end seam) is audio-only"}

  # ----- Group E -----
  - {id: TC15, ticks: 9, user_state: ["m:0","i:1-8"], third_party: false,
     items: [{id: cpu, t_avail: 3, stale: 5, u: low, r: low, s: no}],
     gt: {cpu: {3: DROP}}}

  - {id: TC16, ticks: 11, user_state: ["m:0-5","b:6-7","m:8-10"], third_party: false,
     items: [{id: break, t_avail: 4, stale: null, u: low, r: high, s: yes}],
     gt: {break: {6: "NOW:SPEAK_BRIEF"}}}

  - {id: TC17, ticks: 7, modality_gated: video, user_state: ["m:0-6"], third_party: false,
     items: [{id: allergy, t_avail: 2, stale: 4, u: high, r: high, s: no}],
     gt: {allergy: {2: "NOW:SPEAK_BRIEF+INT"}}}

  # ----- Group F (arbitration; single-channel rule applies) -----
  - {id: TC18, ticks: 14, user_state: ["m:0-5","b:6","m:7-11","b:12-13"], third_party: false,
     items: [{id: meeting, t_avail: 6, stale: 8, u: high, r: low, s: no},
             {id: weather, t_avail: 6, stale: null, u: low, r: low, s: yes}],
     gt: {meeting: {6: "NOW:SPEAK_BRIEF+INT"}, weather: {7: "NOW:SPEAK_BRIEF+RA"}},
     note: "only ORDER scored; weather at t7 (next tick after meeting) or later t12 both pass"}

  - {id: TC19, ticks: 11, user_state: ["m:0-6","b:7-9","m:10"], third_party: false,
     items: [{id: flight, t_avail: 3, stale: null, u: low, r: high, s: yes},
             {id: hotel, t_avail: 5, stale: null, u: low, r: high, s: yes}],
     gt: {flight: {7: "NOW:SPEAK_BRIEF"}, hotel: {8: "NOW:SPEAK_BRIEF"}},
     note: "consecutive NOWs at one seam (channel serializes); two SEPARATED interruptions = cried-wolf"}

  - {id: TC20, ticks: 11, user_state: ["m:0-5","b:6-7","i:8-10"], third_party: false,
     items: [{id: eta_old, t_avail: 2, stale: null, u: low, r: high, s: no},
             {id: eta_new, t_avail: 5, stale: null, u: low, r: high, s: no, supersedes: eta_old},
             {id: smoke, t_avail: 5, stale: 9, u: high, r: low, s: no},
             {id: tip, t_avail: 6, stale: null, u: low, r: low, s: no}],
     gt: {eta_old: {5: DROP}, smoke: {5: "NOW:SPEAK_BRIEF+INT"}, eta_new: {6: "NOW:SPEAK_BRIEF+RA"}, tip: {6: DROP}}}

  # ----- Group G (modality-rich) -----
  - {id: TC21, ticks: 9, modality_gated: video, user_state: ["m:0-8"], third_party: false,
     items: [{id: stove, t_avail: 4, stale: null, u: high, r: low, s: no}],
     gt: {stove: {4: "NOW:SPEAK_BRIEF+INT"}}}

  - {id: TC22, ticks: 9, modality_gated: video, user_state: ["i:0-8"], third_party: ["yes:0-8"],
     items: [{id: meds, t_avail: 5, stale: null, u: low, r: high, s: yes, privacy: sensitive, allowed_forms: [SILENT_NOTIFY]}],
     gt: {meds: {5: "NOW:SILENT_NOTIFY"}}}

  - {id: TC23, ticks: 11, modality_gated: audio, user_state: ["m:0-10"], third_party: false,
     items: [{id: gas, t_avail: 5, stale: 9, u: high, r: low, s: no}],
     gt: {gas: {5: "NOW:SPEAK_BRIEF+INT"}}}

  # ----- Group H (§3.3) -----
  - {id: TC24, ticks: 11, user_state: ["m:0-5","b:6-10"], third_party: false,
     items: [{id: table, t_avail: 3, stale: 6, u: low, r: high, s: yes}],
     gt: {table: {6: DROP}},
     note: "valid on arrival t3; user cancels at stale t6 → DROP (in-queue invalidation)"}

  - {id: TC25, ticks: 9, modality_gated: false, user_state: ["i:0-8"], third_party: false,
     items: [{id: results, t_avail: 5, stale: null, u: low, r: high, s: yes, allowed_forms: [SILENT_NOTIFY]}],
     gt: {results: {5: "NOW:SILENT_NOTIFY"}}}

  - {id: TC26, ticks: 13, user_state: ["m:0-12"], third_party: false,
     items: [{id: pump, t_avail: 4, stale: 12, u: high, r: low, s: no, sev: 3},
             {id: ride, t_avail: 4, stale: 10, u: high, r: low, s: no, sev: 1}],
     gt: {pump: {4: "NOW:SPEAK_BRIEF+INT"}, ride: {5: "NOW:SPEAK_BRIEF"}},
     note: "severity decides order (pump sev3 before ride sev1), not arrival; channel serializes → ride at t5"}

  - {id: TC27, ticks: 11, user_state: ["m:0-6","b:7-10"], third_party: false,
     items: [{id: payment, t_avail: 4, stale: null, u: low, r: high, s: yes, retryable: no}],
     gt: {payment: {7: "NOW:SPEAK_BRIEF"}}}

  - {id: TC28, ticks: 22, suppress_until: {event: end_presentation, tick: 20},
     user_state: ["m:0-5","b:6","m:7-12","b:13","m:14-19","b:20-21"], third_party: false,
     items: [{id: research, t_avail: 6, stale: null, u: low, r: high, s: yes, suppress_until: end_presentation}],
     gt: {research: {20: "NOW:SPEAK_BRIEF"}},
     note: "intermediate breakpoints t6/t13 are NOT delivery points while suppressed; deliver only after the talk (t20)"}

  - {id: TC29, ticks: 21, user_state: ["m:0-18","b:19-20"], third_party: false,
     items: [{id: digest, t_avail: 18, stale: null, u: low, r: low, s: yes}],
     gt: {digest: {19: "NOW:SPEAK_FULL"}},
     note: "instruction asked for the FULL rundown → form is SPEAK_FULL"}
