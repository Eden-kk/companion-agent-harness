# replay_privacy_policy.yaml
#
# See docs/architecture-v0.1.md §Part 6 Stage 0b ("Replay privacy policy")
# for the canonical structure. Reconciles invariant #1 (no unlogged behavior)
# with privacy_mode by separating policy-replay-safe artifacts from
# retention-governed sensitive artifacts.
#
# Filled in during Stage 0 implementation; empty stub at v0.1a-bootstrap.
#
# Entry schema (per Anchor 2 — locked by Task 2 PR):
#   id: stable enum name; renaming after data carries the ID requires
#       retroactive reclassification.
#   description: human-readable purpose.
#   ttl_days_or_indefinite: integer (days) or the string "indefinite".
#
# ID names are durable metadata; TTL values are config-only (tunable without
# data migration).

retention_policies:
  retrieval_audit_30d:
    description: |
      Audit log for memory retrieval queries. 30 days retention sufficient
      for "why did you say that?" lookback + debugging; longer retention
      offers no replay-determinism benefit.
    ttl_days_or_indefinite: 30

  commit_audit_30d:
    description: |
      Audit log for memory commit completions. 30 days. Same rationale
      as retrieval_audit_30d.
    ttl_days_or_indefinite: 30

  audit_indefinite:
    description: |
      Forget tombstones and hard-delete receipts. Retained indefinitely
      per spec lines 523-534: "minimal audit tombstone retained" /
      "non-content deletion receipt retained". The receipts contain NO
      content, only structural identifiers + timestamps.
    ttl_days_or_indefinite: indefinite

  decision_trace_30d:
    description: |
      DecisionTrace artifacts co-emitted with every policy_decision event.
      30 days retention is sufficient for "why did you say that?" lookback
      and latency debugging. All fields are Tier B replay-safe; no PII
      (redacted_explanation is None in v0.1e).
    ttl_days_or_indefinite: 30

  # --- v0.1g Stage 6 additions (Anchor 2 of docs/roadmap-v0.1g-draft.md) ---

  proposal_audit_30d:
    description: |
      Audit log for aesthetic_proposal_generated events (one per
      ThinkerProposal, rubric-pass or rubric-fail) per v0.1g Anchor 4 +
      invariant #1.  30 days matches the other audit-log retentions;
      sufficient for "why did you say that?" lookback and rubric-violation
      attribution.
    ttl_days_or_indefinite: 30

  attachment_risk_audit_365d:
    description: |
      Audit log for attachment_risk_signal events (one per detected
      tracked-signal occurrence; spec lines 843-848).  365 days reflects
      the higher audit bar for distress signals -- false-positive-rate
      gating, longitudinal patterns (prolonged_daily_use_minutes,
      repeated_reassurance_loops), and post-incident review for
      explicit_crisis_signals.  Per-event sensitivity (sensitive vs
      highly_sensitive) is set on the wrapper Event; this retention ID
      governs the audit-log lifetime, not the content's privacy class.
    ttl_days_or_indefinite: 365

  # --- v0.1f Stage 5 additions (Anchor 2 of docs/roadmap-v0.1f-draft.md) ---

  tool_call_audit_30d:
    description: |
      Audit class for tool-call lifecycle receipts (tool_call_requested,
      tool_call_dispatched, tool_progress_event, tool_call_completed,
      tool_call_cancelled). 30 days retention is sufficient for "why did
      you say that?" lookback over tool-status decisions and for the
      Stage 5 contract tests (filler_evidence_bound,
      tool_progress_attribution). v0.1f Anchor 2.
    ttl_days_or_indefinite: 30

  tool_result_default:
    description: |
      Default retention for `safe`-class tool result bodies referenced
      from tool_call_completed events. Sensitive result bodies are
      governed by their own (existing) retention policy ids from the
      v0.1e alphabet; this id covers the safe-result default path so
      no event lands in the log with a missing policy id. v0.1f
      Anchor 2.
    ttl_days_or_indefinite: 30

  config_change_30d:
    description: |
      Audit log for config_change and operator_action events emitted by the
      manual-test dashboard's /config/patch + /config/reset endpoints. 30 days
      is sufficient for "what threshold was in effect at 14:32?" lookback during
      a manual-test session and for post-session replay reproduction
      (docs/design-config-and-dashboard.md §6).
    ttl_days_or_indefinite: 30

  transcript_audit_30d:
    description: |
      ASR transcripts emitted as audit events for invariant #1 compliance
      (PR #144 P0). 30 days retention is sufficient for "what did the user
      say at 14:32?" lookback during a manual-test session. The transcript
      text is wrapped in SensitiveField on the event payload for redaction
      routing.
    ttl_days_or_indefinite: 30

  signal_default_30d:
    description: |
      Default retention for safe, non-PII signal events (e.g.
      native_duplex_invocation). 30 days is sufficient for replay and
      "why did you say that?" lookback; no sensitive content in payload.
    ttl_days_or_indefinite: 30
