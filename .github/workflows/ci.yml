name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extras:
          - name: base
            install: "-e ."
          - name: eval
            install: "-e .[eval]"
    name: test (${{ matrix.extras.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ${{ matrix.extras.install }}

      - name: Run local test suite
        run: python -m pytest -m "not gpu and not real_corpus and not requires_diarization" -q tests/

      - name: Replay report (informational)
        run: python scripts/v0_1a_replay_report.py
        continue-on-error: true
