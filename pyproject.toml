[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-harness"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# manual-test web console (Phase 1: audio capture + observability).
# aiohttp serves the static page and both ingest+display WebSockets in one
# process. Not a hard dep of companion_harness — only required if you run
# `python -m manual_test_console.server`.
manual_test_console = ["aiohttp>=3.9"]

# Eval extras: pull with `pip install -e .[eval]`. Runtime install stays at
# `pip install -e .` (no eval deps). Versions are floor-only (>=) for Phase A;
# exact pinning deferred (OQ-A6.1). pytest-json-report is a Phase A addition
# (not in eval-subsystem-spec.md Anchor 2) — required by A3's subprocess driver.
eval = [
  "datasets>=2.16",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "rich>=13.7",
  "soundfile>=0.12",   # for fixture audio decode
  "pytest-json-report>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["companion_harness*", "manual_test_console*"]

[tool.pytest.ini_options]
# Skip GPU-only / real-model tests by default so `pytest tests/` works on
# CI (ubuntu-latest) and other machines without GPU / model weights. The
# canonical venv on b200 can still run them via explicit invocation, e.g.
# `pytest tests/test_minicpm_streaming_duplex.py`.
addopts = "--ignore=tests/test_minicpm_streaming_duplex.py --ignore=tests/test_direct_question_latency.py --ignore=tests/test_tts_kokoro_real.py --ignore=tests/test_real_detectors.py"
