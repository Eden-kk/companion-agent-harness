[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-harness"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# manual-test web console (Phase 1: audio capture + observability).
# aiohttp serves the static page and both ingest+display WebSockets in one
# process. Not a hard dep of companion_harness — only required if you run
# `python -m manual_test_console.server`.
manual_test_console = ["aiohttp>=3.9"]

# Eval extras: pull with `pip install -e .[eval]`. Runtime install stays at
# `pip install -e .` (no eval deps). Versions are floor-only (>=) for Phase A;
# exact pinning deferred (OQ-A6.1). pytest-json-report is a Phase A addition
# (not in eval-subsystem-spec.md Anchor 2) — required by A3's subprocess driver.
eval = [
  "datasets>=2.16",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "rich>=13.7",
  "soundfile>=0.12",   # for fixture audio decode
  "pytest-json-report>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["companion_harness*", "manual_test_console*"]

[tool.pytest.ini_options]
markers = [
    "gpu: requires GPU and CUDA-specific deps (e.g., torchaudio cu128, kokoro_onnx, MiniCPM-o weights)",
    "real_corpus: requires HF_TOKEN + accepted dataset gates; run on b200 with `pytest -m real_corpus tests/`",
    "requires_diarization: requires v0.2b DiarizationAdapter + model weights; run on b200 with `pytest -m requires_diarization tests/`",
]
# Exclude gpu-marked, real_corpus-marked, and requires_diarization-marked tests by default.
# Run GPU tests on b200: pytest -m gpu tests/
# Run real-corpus tests on b200: pytest -m real_corpus tests/
# Run diarization tests on b200: pytest -m requires_diarization tests/
addopts = "-m 'not gpu and not real_corpus and not requires_diarization'"
# Cap each test at 120 s so a hanging subprocess can't consume the whole CI budget.
# Tests that legitimately need more time should mark themselves with @pytest.mark.timeout(N).
timeout = 120
